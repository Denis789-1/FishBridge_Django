{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishBridge — Вход</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header><div class="container header-content">
    <a href="{% url 'home' %}" class="logo">Fish<span>Bridge</span></a>
    <nav><a href="{% url 'home' %}">Главная</a><a href="{% url 'ponds' %}">Водоёмы</a><a href="{% url 'register' %}">Регистрация</a></nav>
</div></header>
<main class="container">
    <div class="form-panel">
        <h1>Вход в аккаунт</h1>
        <p class="form-description">Войдите, чтобы управлять своими бронированиями</p>
        {% if error %}<div class="form-errors">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group"><label for="username">Логин</label><input type="text" id="username" name="username" placeholder="Введите логин" required></div>
            <div class="form-group"><label for="password">Пароль</label><input type="password" id="password" name="password" placeholder="Введите пароль" required></div>
            <button type="submit" class="btn">Войти</button>
        </form>
        <div class="form-footer"><p>Ещё нет аккаунта?</p><a href="{% url 'register' %}">Зарегистрироваться</a></div>
    </div>
</main>
<footer class="footer"><div class="container"><div class="footer-bottom"><p>© 2026 FishBridge. Все права защищены.</p></div></div></footer>
</body></html>
