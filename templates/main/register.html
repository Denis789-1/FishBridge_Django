{% load static %}
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FishBridge — Регистрация</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<header><div class="container header-content">
    <a href="{% url 'home' %}" class="logo">Fish<span>Bridge</span></a>
    <nav><a href="{% url 'home' %}">Главная</a><a href="{% url 'ponds' %}">Водоёмы</a><a href="{% url 'login' %}">Войти</a></nav>
</div></header>
<main class="container">
    <div class="form-panel">
        <h1>Создание аккаунта</h1>
        <p class="form-description">Заполните данные для регистрации</p>
        {% if error %}<div class="form-errors">{{ error }}</div>{% endif %}
        <form method="post">
            {% csrf_token %}
            <div class="form-group"><label for="first_name">Имя</label><input type="text" id="first_name" name="first_name" placeholder="Введите имя" required></div>
            <div class="form-group"><label for="email">Электронная почта</label><input type="email" id="email" name="email" placeholder="example@mail.ru" required></div>
            <div class="form-group"><label for="username">Логин</label><input type="text" id="username" name="username" placeholder="Придумайте логин" required></div>
            <div class="form-group"><label for="password">Пароль</label><input type="password" id="password" name="password" placeholder="Придумайте пароль" required></div>
            <div class="form-group"><label for="password_repeat">Повторите пароль</label><input type="password" id="password_repeat" name="password_repeat" placeholder="Введите пароль ещё раз" required></div>
            <button type="submit" class="btn">Создать аккаунт</button>
        </form>
        <div class="form-footer"><p>Уже зарегистрированы?</p><a href="{% url 'login' %}">Войти в аккаунт</a></div>
    </div>
</main>
<footer class="footer"><div class="container"><div class="footer-bottom"><p>© 2026 FishBridge. Все права защищены.</p></div></div></footer>
</body></html>
